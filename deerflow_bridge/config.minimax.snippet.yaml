  - name: minimax
    display_name: MiniMax-M3 (code plan)
    # PatchedChatMiniMax strips the per-message `name` field that DeerFlow middlewares
    # inject (avoids MiniMax's 400 "user name must be consistent") and preserves its
    # structured reasoning via extra_body.reasoning_split. Keeps tools + reasoning ON.
    use: deerflow.models.patched_minimax:PatchedChatMiniMax
    model: MiniMax-M3
    api_key: $MINIMAX_API_KEY
    base_url: https://api.minimaxi.com/v1
    request_timeout: 900.0
    max_retries: 2
    # MiniMax-M3: ~1M-token input context, up to 512K output tokens. It inlines its
    # chain-of-thought (thinking tokens count against the output budget), and a deep
    # dossier can be long, so set the output ceiling to the model's full capability —
    # this only removes truncation as a constraint; the model still emits only what it
    # needs.
    max_tokens: 512000
    supports_vision: true
    supports_thinking: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: adaptive
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled

